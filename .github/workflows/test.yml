name: Test
permissions: 
    contents: read

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Get packages
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Knip
        run: pnpm run knip

      - name: Dependencies
        run: pnpm run dependencies:ci

      - name: Typescript
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
        env:
          TZ: Europe/Berlin

